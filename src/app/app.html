<header class="app-header">
  <mat-toolbar>
    <div class="brand-group">
      <span class="material-symbols-outlined brand-icon">vital_signs</span>
      <span class="brand-title">{{ title() }}</span>
      <span class="env-pill">DEMO &bull; CLINICAL OPS</span>
    </div>

    <nav aria-label="Main navigation" class="app-nav">
      <a
        mat-button
        routerLink="/"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >
        <span class="material-symbols-outlined nav-icon">dashboard</span>
        Overview
      </a>
      <a mat-button routerLink="/procedures" routerLinkActive="active-link" class="nav-link">
        <span class="material-symbols-outlined nav-icon">local_hospital</span>
        Procedures
      </a>
      <a mat-button routerLink="/instruments" routerLinkActive="active-link" class="nav-link">
        <span class="material-symbols-outlined nav-icon">precision_manufacturing</span>
        Instruments
      </a>
      <a mat-button routerLink="/schedule" routerLinkActive="active-link" class="nav-link">
        <span class="material-symbols-outlined nav-icon">calendar_month</span>
        Schedule
      </a>
      <a mat-button routerLink="/activity" routerLinkActive="active-link" class="nav-link">
        <span class="material-symbols-outlined nav-icon">history</span>
        Activity
      </a>
    </nav>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 12px">
      <button
        type="button"
        class="palette-trigger"
        aria-label="Open command palette"
        aria-keyshortcuts="Control+K"
        (click)="commandPalette.open()"
      >
        <mat-icon aria-hidden="true">search</mat-icon>
        <span class="palette-label">Search</span>
        <kbd class="palette-hint">Ctrl K</kbd>
      </button>
      <button
        type="button"
        class="live-pill"
        [class.connected]="realtimeService.isSimulationActive()"
        [class.disconnected]="!realtimeService.isSimulationActive()"
        (click)="realtimeService.toggleSimulation()"
        [matTooltip]="
          realtimeService.isSimulationActive()
            ? 'Live push active (click to pause)'
            : 'Simulation paused (click to resume)'
        "
        [attr.aria-label]="
          realtimeService.isSimulationActive()
            ? 'Live feed active, click to pause'
            : 'Live feed paused, click to resume'
        "
      >
        <span class="pulse-dot"></span>
        <span class="live-label">{{
          realtimeService.isSimulationActive() ? 'LIVE' : 'PAUSED'
        }}</span>
      </button>
      <button
        mat-icon-button
        type="button"
        (click)="themeService.toggleTheme()"
        [matTooltip]="
          themeService.currentTheme() === 'dark' ? 'Switch to Light Theme' : 'Switch to Dark Theme'
        "
        aria-label="Toggle visual theme"
      >
        <mat-icon>{{
          themeService.currentTheme() === 'dark' ? 'light_mode' : 'dark_mode'
        }}</mat-icon>
      </button>
      <app-simulation-panel />
      <app-alert-center />
      <app-info-drawer />
    </div>
  </mat-toolbar>
</header>

<main class="app-main">
  <router-outlet />
</main>
